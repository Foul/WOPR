{% extends "base.html" %}
{% block title %}Nouvelle prise en charge{% endblock %}
{% block body %}
<div class="sheet-banner narrow">
  <div class="banner-top">{{ config.website }} &nbsp; - &nbsp; {{ config.email }} &nbsp; - &nbsp; {{ config.phone }}</div>
  <div class="banner-title">Prise en charge / Suivi de réparation</div>
</div>

<form method="post" class="sheet-form">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="client_id" id="existing-client-id" value="">

  <div class="section-title">Informations Client</div>

  <div class="grid one">
    <label>Rechercher un client existant
      <input id="existing-client-search"
             type="search"
             autocomplete="off"
             placeholder="Commence à taper un nom ou une entreprise…">
      <select id="existing-client-results" size="4" style="display:none; margin-top:.45rem;"></select>
      <small id="existing-client-help">Tape au moins 2 caractères : nom, entreprise, téléphone ou courriel.</small>
    </label>
  </div>

  <div class="grid two">
    <label>Prénom<input id="client-first-name" name="first_name" autocomplete="given-name"></label>
    <label>Nom<input id="client-last-name" name="last_name" autocomplete="family-name"></label>
    <label class="wide">Entreprise<input id="client-company" name="company" autocomplete="organization"></label>
    <label>Date<input type="date" name="received_date" value="{{ today }}" required></label>
    <label class="wide">Adresse<input id="client-address" name="address_street"></label>
    <label>Code postal
      <input id="client-postal-code" name="postal_code" inputmode="numeric" maxlength="5"
             data-postal-autocomplete
             data-city-target="client-city"
             data-postal-data="{{ url_for('static', filename='data/postal_codes.json') }}">
    </label>
    <label>Ville<input id="client-city" name="city"></label>
    <label>Téléphone<input id="client-phone" name="phone"></label>
    <label>Courriel<input id="client-email" type="email" name="email"></label>
  </div>

  <div class="section-title">Détails de l'Appareil</div>
  <div class="grid two">
    <label>Type d'Appareil<input name="device_type"></label>
    <label>Marque et Modèle<input name="brand_model"></label>
    <label>Numéro de Série<input name="serial_no"></label>
    <label>Système<input name="system_name" placeholder="Windows 11, macOS, Linux..."></label>
    <label>Mot de passe
      <div class="password-field">
        <input type="password" name="system_password" autocomplete="off">
        <button type="button" class="password-toggle" aria-label="Afficher le mot de passe">👁</button>
      </div>
    </label>
    <label class="wide">Accessoires<textarea name="accessories"></textarea></label>
    <label class="wide">État<textarea name="device_state"></textarea></label>
  </div>

  <div class="section-title">Description du Problème</div>
  <div class="grid one">
    <label>Panne<textarea name="problem" required rows="5"></textarea></label>
    <label>Remarques<textarea name="remarks" rows="3"></textarea></label>
  </div>

  <div class="footer-actions">
    <button class="primary" type="submit">Créer le dossier</button>
  </div>
</form>

<script src="{{ url_for('static', filename='js/postal-autocomplete.js') }}?v={{ app_version }}"></script>
<script>
(() => {
  const search = document.getElementById('existing-client-search');
  const results = document.getElementById('existing-client-results');
  const hiddenId = document.getElementById('existing-client-id');
  const help = document.getElementById('existing-client-help');
  const searchUrl = {{ url_for('repair_client_search')|tojson }};
  const fields = {
    first_name: document.getElementById('client-first-name'),
    last_name: document.getElementById('client-last-name'),
    company: document.getElementById('client-company'),
    address_street: document.getElementById('client-address'),
    postal_code: document.getElementById('client-postal-code'),
    city: document.getElementById('client-city'),
    phone: document.getElementById('client-phone'),
    email: document.getElementById('client-email')
  };
  let foundClients = [];
  let searchTimer = null;
  let requestSerial = 0;
  const clientLabel = c => {
    const first = String(c.first_name || '').trim();
    const last = String(c.last_name || c.name || '').trim();
    const person = [first, last].filter(Boolean).join(' ');
    const company = String(c.company || '').trim();
    const normalized = value => String(value || '')
      .trim()
      .replace(/\s+/g, ' ')
      .toLocaleLowerCase('fr-FR');

    if (person && company && normalized(person) !== normalized(company)) {
      return `${person} — ${company}`;
    }
    return person || company || String(c.name || '').trim();
  };
  const clearSelection = () => { hiddenId.value = ''; };
  const hideResults = () => {
    results.innerHTML = '';
    results.style.display = 'none';
    foundClients = [];
  };
  const fillClient = client => {
    hiddenId.value = String(client.id);
    Object.entries(fields).forEach(([key, el]) => { if (el) el.value = client[key] || ''; });
    search.value = clientLabel(client);
    hideResults();
    help.textContent = '✓ Client existant sélectionné.';
  };
  const renderResults = clients => {
    hideResults();
    foundClients = clients;
    if (!clients.length) {
      help.textContent = 'Aucun client correspondant — tu peux saisir un nouveau client ci-dessous.';
      return;
    }
    clients.forEach(c => {
      const option = document.createElement('option');
      option.value = String(c.id);
      option.textContent = clientLabel(c);
      results.appendChild(option);
    });
    results.size = Math.min(Math.max(clients.length, 2), 6);
    results.style.display = '';
    help.textContent = `${clients.length} client(s) correspondant(s).`;
  };
  const runSearch = async query => {
    const serial = ++requestSerial;
    help.textContent = 'Recherche…';
    try {
      const response = await fetch(`${searchUrl}?q=${encodeURIComponent(query)}`, {
        headers: {'Accept': 'application/json'}, credentials: 'same-origin'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const clients = await response.json();
      if (serial !== requestSerial) return;
      renderResults(Array.isArray(clients) ? clients : []);
    } catch (error) {
      if (serial !== requestSerial) return;
      hideResults();
      help.textContent = 'Recherche client indisponible — tu peux saisir les coordonnées manuellement.';
    }
  };
  search.addEventListener('input', () => {
    clearSelection();
    window.clearTimeout(searchTimer);
    const q = search.value.trim();
    if (q.length < 2) {
      ++requestSerial;
      hideResults();
      help.textContent = q ? 'Tape au moins 2 caractères.' : 'Tape le début d’un nom, d’une entreprise, d’un téléphone ou d’un courriel.';
      return;
    }
    searchTimer = window.setTimeout(() => runSearch(q), 180);
  });
  const useSelectedClient = () => {
    const client = foundClients.find(c => String(c.id) === results.value);
    if (client) fillClient(client);
  };
  results.addEventListener('change', useSelectedClient);
  results.addEventListener('dblclick', useSelectedClient);
})();
</script>
{% endblock %}
